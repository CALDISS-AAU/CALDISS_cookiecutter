[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "This is a dummy project setup using uv. Use as reference for other CALDISS projects"
requires-python = ">=3.12"
dependencies = []
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[project.scripts]
create-pipeline = "Shared_Functions.pipeline_generator:main"

[tool.setuptools]
packages = ["Shared_Functions"]